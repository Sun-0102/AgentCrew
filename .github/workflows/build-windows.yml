name: Build Windows installer

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Set up Rust MSVC toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run desktop:build

      - name: Verify installer output and generate checksums
        run: |
          $installers = @(Get-ChildItem -Path releases -Filter *.exe -File)
          if ($installers.Count -eq 0) {
            throw 'The build did not produce a Windows installer.'
          }
          $checksums = $installers | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content -Path releases/SHA256SUMS.txt -Encoding utf8

      - name: Upload Windows installer
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: AgentCrew-Windows-x64-${{ github.run_number }}
          path: |
            releases/*.exe
            releases/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Show download link
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          @"
          ## Windows installer ready

          [Download the installer archive]($env:ARTIFACT_URL)

          Extract the archive and run the included .exe installer.

          Source commit: $env:GITHUB_SHA
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY
